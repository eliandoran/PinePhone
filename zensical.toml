# User documentation, built with Zensical: `just docs` (preview), `just docs-build` (into site/)
[project]
site_name = "PinePhone feature phone"
site_description = "Using the feature phone firmware for the PinePhone"
site_url = "https://eliandoran.github.io/PinePhone/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Mobile network" = "mobile.md" },
  { "Apps" = [
    { "Phone" = "apps/phone.md" },
    { "Messages" = "apps/messages.md" },
    { "Contacts" = "apps/contacts.md" },
    { "Camera" = "apps/camera.md" },
    { "Gallery" = "apps/gallery.md" },
    { "Music" = "apps/music.md" },
    { "Clock" = "apps/clock.md" },
    { "Calendar" = "apps/calendar.md" },
    { "Calculator" = "apps/calculator.md" },
    { "Notes" = "apps/notes.md" },
    { "Tasks" = "apps/tasks.md" },
    { "Recorder" = "apps/recorder.md" },
    { "Files" = "apps/files.md" },
    { "Maps" = "apps/maps.md" },
    { "Weather" = "apps/weather.md" },
    { "Compass" = "apps/compass.md" },
    { "Web Lite" = "apps/web-lite.md" },
    { "Books" = "apps/books.md" },
    { "Assistant" = "apps/assistant.md" },
    { "Snake" = "apps/snake.md" },
    { "Settings" = "apps/settings.md" },
  ] },
  { "External apps" = [
    { "About external apps" = "external/index.md" },
    { "Telegram" = "external/telegram.md" },
    { "GitHub" = "external/github.md" },
    { "Email" = "external/email.md" },
    { "Browser" = "external/browser.md" },
    { "Terminal" = "external/terminal.md" },
    { "Doom" = "external/doom.md" },
    { "Genesis" = "external/genesis.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
