# phone-ui's modem (src/modem.c): the PinePhone's Quectel EG25-G on the internal USB,
# its AT port the tty of its interface 2 (ttyUSB2 usually; another number when it reset
# while that one was still open)
provider=at
usb=2c7c:0125
interface=2
quirks=quectel
# S01modem powers it at boot and it is on USB about 12 s later: "Starting" rather than
# "No modem" until 30 s after boot
boot_wait=30
# No sms_domain=: SMS as the modem's firmware sends them, over IMS on LTE (Vodafone RO
# takes them). A network that refuses them (+CMS ERROR: 350, Digi) needs sms_domain=cs:
# circuit switched, through SGs, written into the modem when it differs, then the modem
# restarted (again after a new SIM: its carrier profile puts its own value back)
# IMS on: calls over 4G (VoLTE), until the user says otherwise (Settings > Network > Calls
# over 4G); a network that does not register the modem with IMS gets its calls over 2G/3G
# all the same (Digi, 2026-11-11). Vodafone RO's work both ways. Written when it differs,
# then the modem restarted
ims=on
# Off by default on these home networks (the SIM's MCC and MNC): Digi RO registered the
# modem with IMS on 2026-11-10, then the modem refused the calls it offers (488 to an
# incoming one, which then came over 2G; its own cancelled at once, "Offer Refused")
volte_broken=22605
# Settings the modem keeps (AT+QCFG), written when they differ: its own may be lost (its
# firmware flashed). Those eg25-manager (postmarketOS, Mobian) sets for the PinePhone 1.2,
# as this one had them. The ring indicator (RI, PL6) pulses for a call (every 6 s while it
# rings) and an SMS, which wakes the phone; other reports do not; none delayed or held
qcfg="risignaltype","physical"
qcfg="urc/ri/pin",uart_ri
qcfg="urc/ri/ring","pulse",120,1000,5000,"off",1
qcfg="urc/ri/smsincoming","pulse",120,1
qcfg="urc/ri/other","off",1,1
qcfg="urc/delay",0
qcfg="urc/cache",0
# AP_READY (PH7, held low by S01modem: awake) consulted before reporting
qcfg="apready",1,0,500
# A crash restarts it rather than waiting in its RAM dump mode; powered off properly
qcfg="ApRstLevel",1
qcfg="ModemRstLevel",1
qcfg="fast/poweroff",0
# Mobile data: its network interface (qmi_wwan's), set up by the board's script
data=wwan0
data_script=/etc/phone-ui/mobile-data.sh
# Calls' sound through the codec: the modem's PCM on AIF2 to the earpiece or the
# loudspeaker, the microphone to the modem
audio_script=/etc/phone-ui/call-audio.sh
