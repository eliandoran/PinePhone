# phone-ui's modem (src/modem.c): the PinePhone's Quectel EG25-G on the internal USB,
# its AT port the tty of its interface 2 (ttyUSB2 usually; another number when it reset
# while that one was still open)
provider=at
usb=2c7c:0125
interface=2
quirks=quectel
# S30modem powers it at boot and it is on USB about 12 s later: "Starting" rather than
# "No modem" until 30 s after boot
boot_wait=30
# SMS circuit switched (through SGs on LTE), not over IMS: its firmware's own setting,
# which a network refuses (+CMS ERROR: 350) when it does not give IMS to this modem
# (Digi). Written into the modem when it differs, then the modem restarted once
sms_domain=cs
# IMS off: calls and USSD circuit switched, falling back from LTE to 2G/3G. Until the user
# says otherwise (Settings > Network > Calls over 4G): whether a network's calls over IMS
# work with the EG25-G depends on the network. Digi's do not: the modem refuses the calls
# its IMS offers (488 to an incoming one, which then comes over 2G; its own cancelled at
# once, "Offer Refused", +CEER: 5,36). Written with sms_domain=, one restart for both
ims=off
# Mobile data: its network interface (qmi_wwan's), set up by the board's script
data=wwan0
data_script=/etc/phone-ui/mobile-data.sh
# Calls' sound through the codec: the modem's PCM on AIF2 to the earpiece or the
# loudspeaker, the microphone to the modem
audio_script=/etc/phone-ui/call-audio.sh
