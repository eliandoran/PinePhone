# phone-ui's modem (src/modem.c): the PinePhone's Quectel EG25-G on the internal USB,
# its AT port the tty of its interface 2 (ttyUSB2 usually; another number when it reset
# while that one was still open)
provider=at
usb=2c7c:0125
interface=2
quirks=quectel
# Mobile data: its network interface (qmi_wwan's), set up by the board's script
data=wwan0
data_script=/etc/phone-ui/mobile-data.sh
