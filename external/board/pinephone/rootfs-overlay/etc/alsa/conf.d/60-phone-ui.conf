# phone-ui's sound to a Bluetooth audio device (bluetooth.c): bluez-alsa's PCM of that
# device, converted to the rate its stream runs at (RATE, from bluealsa). Opened at another
# rate, bluealsa renegotiates the codec, which some devices refuse (the PCM goes).
pcm.phone_bt {
	@args [ DEV RATE ]
	@args.DEV {
		type string
	}
	@args.RATE {
		type integer
	}
	type plug
	slave {
		pcm {
			type bluealsa
			device $DEV
			profile "a2dp"
			codec "unchanged"
			volume "unchanged"
			softvol "unchanged"
			delay 0
			service "org.bluealsa"
		}
		rate $RATE
	}
}
