# bluetoothd's settings (BlueZ's defaults for the rest); its state, paired devices
# included, is kept in /var/lib/bluetooth on the data partition
[General]
# The name other devices see, and a smartphone's device class (major Phone, minor
# Smartphone; BlueZ adds the service bits)
Name = PinePhone
Class = 0x00020c

[Policy]
# Off at boot: phone-ui turns it on when Settings › Bluetooth was left on (bluetooth.c)
AutoEnable = false
