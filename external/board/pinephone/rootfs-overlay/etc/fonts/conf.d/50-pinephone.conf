<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<description>The generic families as the fonts in the image (DejaVu). post-build.sh removes
		the stock aliases for fonts that are not installed: Skia checks each family of
		a pattern with a match of its own, over 100 of them per lookup with those.</description>
	<alias binding="same">
		<family>sans-serif</family>
		<prefer><family>DejaVu Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>serif</family>
		<prefer><family>DejaVu Serif</family></prefer>
	</alias>
	<alias binding="same">
		<family>monospace</family>
		<prefer><family>DejaVu Sans Mono</family></prefer>
	</alias>
</fontconfig>
