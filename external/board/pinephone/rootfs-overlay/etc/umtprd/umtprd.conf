#
# uMTP Responder (umtprd), started by /etc/phone-ui/usb-mode.sh in MTP mode.
# The full list of options: umtprd's conf/umtprd.conf.
#

# Keep running across a host's disconnect (unplugged, or the gadget rebound)
loop_on_disconnect 1

# Uploads readable by every app (phone-ui and the external apps run as root)
umask 022

# What a computer sees: the apps' media folders, each a storage of its own.
# Not all of /var/lib: it also holds Wi-Fi passwords, messages and SSH keys.
storage "/var/lib/photos"      "Photos"      "rw"
storage "/var/lib/music"       "Music"       "rw"
storage "/var/lib/books"       "Books"       "rw"
storage "/var/lib/notes"       "Notes"       "rw"
storage "/var/lib/genesis"     "Genesis"     "rw"
storage "/var/lib/doom/wads"   "Doom WADs"   "rw"

manufacturer "Pine64"
product "PinePhone"
serial "01234567"
firmware_version "1.0"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"

# The device descriptor is configfs's (S05usbgadget); these are the interface's
usb_vendor_id  0x1D6B
usb_product_id 0x0104
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x0100

# Data on the eMMC once a file is written, before the cable may be pulled
sync_when_close 0x1

usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
