# The bootloader (Tow-Boot now, our own U-Boot later) lives in the first 4 MiB
# and is never part of this image: the flasher only writes the partition table
# (sector 0) and everything from 4 MiB on.

image pinephone.img {
	hdimage {
		partition-table-type = "mbr"
		# root=PARTUUID=50480001-01 in extlinux.conf depends on this
		disk-signature = 0x50480001
	}

	partition rootfs {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext4"
		offset = 4M
	}
}
