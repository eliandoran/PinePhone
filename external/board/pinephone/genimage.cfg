# The bootloader is never part of this image. Tow-Boot lives in the eMMC boot0
# hardware partition; a bootloader in the first 4 MiB (our own U-Boot later)
# is kept too, since the flasher only writes sector 0 and everything from 4 MiB on.
#
# Two root slots, A and B. The bootloader boots the one with the bootable flag;
# pp-update writes the other one and moves the flag (see /usr/sbin/pp-update).

image pinephone.img {
	hdimage {
		partition-table-type = "mbr"
		# PARTUUIDs are 50480001-01 (slot A) and 50480001-02 (slot B)
		disk-signature = 0x50480001
	}

	partition rootfs-a {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext4"
		offset = 4M
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}

# The same for a microSD card, to try the firmware without touching the eMMC: Tow-Boot
# at 8 KiB, where the A64's boot ROM looks first on the card (package/tow-boot), so it
# starts whatever the eMMC holds. Its own disk signature: a card and the eMMC both
# holding the firmware do not share partition IDs (rootfs-sd.ext4: post-image.sh).
# Not for the eMMC: there Tow-Boot lives in boot0.

image pinephone-sd.img {
	hdimage {
		partition-table-type = "mbr"
		# PARTUUIDs are 50480002-01 (slot A) and 50480002-02 (slot B)
		disk-signature = 0x50480002
	}

	partition tow-boot {
		in-partition-table = false
		image = "Tow-Boot.noenv.bin"
		offset = 8K
	}

	partition rootfs-a {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs-sd.ext4"
		offset = 4M
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
