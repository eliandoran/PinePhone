<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phone-ui</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(90vh, 180vw); aspect-ratio: 1 / 2; border-radius: 24px; touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<script>
var Module = { canvas: document.getElementById('canvas') };
/* Errors with their stack, in the console */
addEventListener('unhandledrejection', e => console.error(e.reason && e.reason.stack || e.reason));
addEventListener('error', e => console.error(e.error && e.error.stack || e.message));
</script>
<script src="phone-ui.js"></script>
</body>
</html>
