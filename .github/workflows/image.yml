# The firmware image, built as `just build` does (the flake's FHS environment, the same
# defconfig: what CI publishes is what runs on the phone), for flashing a phone without a
# build of one's own (docs/install.md):
#   pinephone-VERSION.img.xz           the whole image, for USB mass storage (`--usb`)
#   pinephone-VERSION-sd.img.xz        the same for a microSD card, Tow-Boot included
#   pinephone-VERSION-rootfs.ext4.xz   the root filesystem, over the air
#   pinephone-VERSION(-sd).img.bmap    the blocks of an image that hold data, for bmaptool
#   SHA256SUMS                         of those
# VERSION is `git describe` (the last tag, commits since and the commit). Every push to main
# keeps them as the run's artifact for 30 days; a tag v* publishes them as a GitHub release.
#
# A build from nothing (WebKit and TDLib for the apps, an estimated 4 h on a hosted runner's 4
# cores) may not fit its 6 h: ccache and the downloads (dl/) are kept between runs, saved even
# when a run on main fails or times out, so the next one goes further. The runner's 25 GB or so of
# free disk are short for output/ (14 GB), ccache, dl/ and Nix: its preinstalled SDKs go first.
#
# The build is one job (output/ is too large to hand to another) in steps, a Buildroot target
# each, through scripts/ci-build-step.sh: the run's summary has a row per step with its time and
# ccache's hits and misses. The steps share a deadline of their own ahead of the job's, so the
# build is stopped by us, nothing left writing to the ccache while it is saved.

name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - docs/**
      - notes/**
      - demo/**
      - apps/**
      - external/package/phone-ui/tests/**
      - external/package/phone-ui/wasm/**
      - zensical.toml
      - '**.md'
      - .github/workflows/docs.yml
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: write  # the release of a tag
  actions: write   # dropping older caches

# One build at a time, the newest push waiting rather than cancelling one that may be
# filling the caches (a cancelled run saves what it compiled all the same)
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      # About 30 GB more: Android's SDK, .NET, Haskell, CodeQL, the tool cache, Docker's images
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia*
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for git describe

      - uses: cachix/install-nix-action@v31

      # Ubuntu's AppArmor forbids unprivileged user namespaces, which the FHS environment's
      # bubblewrap needs
      - name: Allow user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('Makefile', 'external/configs/pinephone_defconfig', 'external/package/**/*.hash', 'external/package/**/*.mk') }}
          restore-keys: dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-

      # The defconfig with ccache, CI's only change: it caches the compiler's output, the
      # image is the same. The build's deadline: 315 minutes from here, which leaves the job's
      # 355 the setup above, the caches' saving and the packaging
      - name: Configure
        run: |
          nix run .#fhs -- -c "make $PWD/output/.config"
          cat >> output/.config <<'EOF'
          BR2_CCACHE=y
          BR2_CCACHE_DIR="$(HOME)/.buildroot-ccache"
          BR2_CCACHE_INITIAL_SETUP="--max-size=5G"
          EOF
          nix run .#fhs -- -c 'make olddefconfig'
          grep -qx BR2_CCACHE=y output/.config
          echo "BUILD_DEADLINE=$(( $(date +%s) + 315 * 60 ))" >> "$GITHUB_ENV"
          {
            echo "### Build"
            echo
            echo '| Step | Result | Time | ccache hits | misses | ccache size |'
            echo '|---|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

      # Each a target with what it depends on and is not built yet; the last one the rest
      # (phone-ui, the other packages) and the image. ccache is built without itself
      - name: Build ccache (host tools)
        run: bash scripts/ci-build-step.sh host-ccache

      - name: Build the toolchain
        run: bash scripts/ci-build-step.sh toolchain

      - name: Build WebKit's libraries
        run: bash scripts/ci-build-step.sh wpewebkit-depends

      - name: Build WebKit
        id: webkit
        run: bash scripts/ci-build-step.sh wpewebkit

      # Four hours of compiling when the cache had none of it: kept at once, whatever the
      # steps after it do (not when all of it came from the cache)
      - name: Save ccache with WebKit
        if: github.ref == 'refs/heads/main' && steps.webkit.outputs.misses != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}-webkit

      - name: Build TDLib
        run: bash scripts/ci-build-step.sh tdlib

      - name: Build the kernel
        run: bash scripts/ci-build-step.sh linux

      - name: Build the rest and the image
        id: build
        run: bash scripts/ci-build-step.sh all

      # A cancelled step's compilers, which the script did not get to stop
      - name: Stop what is left of the build
        if: always()
        run: bash scripts/ci-build-step.sh --stop

      # Saved even when the build failed or ran out of time: the next run starts from there.
      # Only from main: a tag's caches are its own, no other run would find them. The key has
      # the attempt: a failed run run again would find its key taken and save nothing
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      # The repository's caches hold 10 GB: only the newest ccache is kept, once this run's
      # is saved (a save fails with a warning only, e.g. when nothing was compiled)
      - name: Drop older ccaches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="ccache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keys=$(gh cache list --key ccache- --limit 100 --json key --jq '.[].key')
          grep -qx "$key" <<<"$keys" || { echo "No ccache saved, the others kept."; exit 0; }
          gh cache list --key ccache- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$key\") | .id" |
            xargs -r -n 1 gh cache delete

      - name: Save downloads
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('Makefile', 'external/configs/pinephone_defconfig', 'external/package/**/*.hash', 'external/package/**/*.mk') }}

      - name: Package
        id: package
        run: |
          version=$(git describe --tags --always)
          mkdir -p dist
          # Which blocks hold data (the first 4 MiB are a hole but the partition table): bmaptool
          # writes only those, from the .xz
          for img in pinephone pinephone-sd; do
            nix shell --inputs-from . nixpkgs#bmaptool -c bmaptool create \
              -o "dist/${img/pinephone/pinephone-$version}.img.bmap" "output/images/$img.img"
            xz -T0 -9 -c "output/images/$img.img" > "dist/${img/pinephone/pinephone-$version}.img.xz"
          done
          xz -T0 -9 -c output/images/rootfs.ext4 > "dist/pinephone-$version-rootfs.ext4.xz"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Image $version"
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in dist/*.xz dist/*.bmap; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pinephone-${{ steps.package.outputs.version }}
          path: dist/
          compression-level: 0  # already xz
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME"
